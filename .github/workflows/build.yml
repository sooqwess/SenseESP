name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - v1_21_1
          - v1_21_3
          - v1_21_4
          - v1_21_5
          - v1_21_8
          - v1_21_9
          - v1_21_10
          - v1_21_11
          - v26_1
          - v26_2
          - v26_3

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build ${{ matrix.target }}
        run: ./gradlew -Ptarget=${{ matrix.target }} :${{ matrix.target }}:build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: senseesp-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/espmod-*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
            !${{ matrix.target }}/build/libs/*-dev.jar
