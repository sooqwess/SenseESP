subprojects { sub ->
    def cfg = TARGETS[sub.name]
    if (cfg == null) return

    apply plugin: cfg.remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

    group = rootProject.property('maven_group')
    version = "${rootProject.property('mod_base_version')}+${cfg.tagSuffix}"

    base {
        archivesName = rootProject.property('archives_base_name')
    }

    repositories {
        maven { url = 'https://maven.shedaniel.me/' }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${cfg.mc}"
        if (cfg.remap) {
            mappings "net.fabricmc:yarn:${cfg.yarn}:v2"
            modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
            ['fabric-api-base', 'fabric-key-binding-api-v1', 'fabric-lifecycle-events-v1', 'fabric-rendering-v1', 'fabric-resource-loader-v0'].each { modName ->
                try {
                    modImplementation fabricApi.module(modName, cfg.fapi)
                } catch (Exception ignored) {
                    if (modName == 'fabric-resource-loader-v0') {
                        modImplementation fabricApi.module('fabric-resource-loader-v1', cfg.fapi)
                    }
                }
            }
            modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cfg.cloth}") {
                exclude(group: 'net.fabricmc.fabric-api')
            }
            modCompileOnly "maven.modrinth:modmenu:${cfg.modmenu}"
        } else {
            implementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
            ['fabric-api-base', 'fabric-key-mapping-api-v1', 'fabric-lifecycle-events-v1', 'fabric-rendering-v1', 'fabric-resource-loader-v1'].each { modName ->
                try {
                    implementation fabricApi.module(modName, cfg.fapi)
                } catch (Exception ignored) {
                    if (modName == 'fabric-key-mapping-api-v1') {
                        implementation fabricApi.module('fabric-key-binding-api-v1', cfg.fapi)
                    }
                }
            }
            implementation("me.shedaniel.cloth:cloth-config-fabric:${cfg.cloth}") {
                exclude(group: 'net.fabricmc.fabric-api')
            }
            compileOnly "maven.modrinth:modmenu:${cfg.modmenu}"
        }
    }

    sourceSets {
        main {
            java {
                srcDir rootProject.file('common/src/main/java')
            }
            resources {
                srcDir rootProject.file('common/src/main/resources')
            }
        }
    }

    def javaVer = cfg.javaRelease == 25 ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
    java {
        sourceCompatibility = javaVer
        targetCompatibility = javaVer
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = cfg.javaRelease
    }

    processResources {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        inputs.property 'version', project.version
        inputs.property 'mc_dep', cfg.mcDep
        inputs.property 'java_ver', cfg.javaRelease

        filesMatching('fabric.mod.json') {
            expand(
                version : project.version,
                mc_dep  : cfg.mcDep,
                java_ver: cfg.javaRelease
            )
        }
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}
